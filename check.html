<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Проверка подключения · HTML Course</title>
<!--
  Служебная страница: проверяет, что конфиг Firebase найден
  и анонимный вход работает. Студентам ссылку не давать.
  Проверка Firestore добавится вместе с правилами безопасности.
-->
<style>
  .chk { --ink:#14161E; --ink-2:#454B60; --slate:#4E5675; --electric:#1A40E7;
         --ok:#17693A; --err:#B3261E; --paper:#F4F5F8; --surface:#FFFFFF; --line:#DCDEE7;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         color: var(--ink-2); background: var(--paper); min-height: 100vh;
         box-sizing: border-box; padding: 32px 16px; }
  @media (prefers-color-scheme: dark) {
    .chk { --ink:#EDEFF6; --ink-2:#A9B0C7; --slate:#98A2C6; --electric:#8DA2FF;
           --ok:#7DD3A0; --err:#FFB4AB; --paper:#171A23; --surface:#11131A; --line:#2C3040; }
  }
  .chk__card { max-width: 640px; margin: 0 auto; background: var(--surface);
               border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
  .chk__title { margin: 0 0 4px; color: var(--slate); font-size: 26px; font-weight: 800; }
  .chk__lead { margin: 0 0 20px; }
  .chk__list { list-style: none; margin: 0 0 20px; padding: 0; }
  .chk__row { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .chk__mark { flex: 0 0 24px; font-weight: 800; }
  .chk__row[data-s="ok"] .chk__mark { color: var(--ok); }
  .chk__row[data-s="err"] .chk__mark { color: var(--err); }
  .chk__detail { display: block; font-size: 14px; word-break: break-word; }
  .chk__btn { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px;
              background: var(--electric); color: var(--surface); font: inherit; font-weight: 700; cursor: pointer; }
  .chk__btn:focus-visible { outline: 3px solid var(--slate); outline-offset: 3px; }
  body { margin: 0; }
</style>
</head>
<body>
<main class="chk">
  <div class="chk__card">
    <h1 class="chk__title">Проверка подключения</h1>
    <p class="chk__lead">Страница проверяет конфиг Firebase, вход студента и доступ к базе. Всё должно стать зелёным.</p>
    <ul class="chk__list" id="list" aria-live="polite"></ul>
    <button class="chk__btn" id="run" type="button">Проверить ещё раз</button>
  </div>
</main>

<script type="module">
  const list = document.getElementById('list');

  function row(label, state, detail = '') {
    const li = document.createElement('li');
    li.className = 'chk__row';
    li.dataset.s = state;
    const mark = document.createElement('span');
    mark.className = 'chk__mark';
    mark.textContent = state === 'ok' ? '✓' : state === 'err' ? '✕' : '…';
    const body = document.createElement('span');
    body.textContent = label;
    if (detail) {
      const d = document.createElement('span');
      d.className = 'chk__detail';
      d.textContent = detail;
      body.append(d);
    }
    li.append(mark, body);
    list.append(li);
    return li;
  }

  async function run() {
    list.replaceChildren();
    const location = window.location.host || 'file://';
    row('Адрес страницы', 'ok', location);

    let fb;
    try {
      fb = await import('./js/firebase-init.js');
      row('Конфиг найден, Firebase инициализирован', 'ok',
          `Проект ${fb.projectId}, SDK ${fb.sdkVersion}`);
    } catch (err) {
      row('Firebase не инициализирован', 'err', err.message);
      return;
    }

    try {
      const cred = await fb.signInAnonymously(fb.auth);
      row('Анонимный вход студента работает', 'ok', `UID ${cred.user.uid}`);
    } catch (err) {
      const hints = {
        'auth/operation-not-allowed': 'Включите Anonymous: Authentication → Sign-in method.',
        'auth/unauthorized-domain':   `Добавьте ${location.split(':')[0]} в Authentication → Settings → Authorized domains.`,
        'auth/api-key-not-valid':     'Проверьте apiKey в js/config.js.',
        'auth/network-request-failed':'Нет связи с серверами Google — проверьте сеть.'
      };
      row('Анонимный вход не прошёл', 'err', `${err.code}. ${hints[err.code] || err.message}`);
      return;
    }

    try {
      const g = await fb.getDoc(fb.doc(fb.db, 'groups', 'ling26'));
      row('Чтение базы: правила Firestore опубликованы', 'ok',
          g.exists() ? `Группа ling26 найдена, набор ${g.data().active ? 'открыт' : 'закрыт'}` : 'Группа ling26 не найдена в коллекции groups');
    } catch (err) {
      row('База не пускает', 'err', `${err.code}. Опубликуйте правила: Firestore Database, вкладка Rules, текст из firebase/firestore.rules, кнопка Publish.`);
    }
  }

  document.getElementById('run').addEventListener('click', run);
  run();
</script>
</body>
</html>
